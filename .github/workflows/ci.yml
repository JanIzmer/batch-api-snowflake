name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes the run in flight for the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DEFAULT: "3.11"

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Ruff
        run: |
          ruff check --output-format=github src tests airflow
          ruff format --check src tests

      - name: Mypy
        run: mypy

  test:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what the image runs; 3.12 is the next target, and finding out
        # it breaks here is much cheaper than finding out during an upgrade.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Pytest
        run: pytest --cov=pipeline --cov-report=xml --cov-report=term-missing

      - name: Contract smoke test
        # The contract file is data, so a typo in it would otherwise only show
        # up at 05:00 in production.
        run: weather-pipeline check-contract weather_observation 1

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  dbt:
    name: dbt parse and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip

      - name: Install dbt
        run: |
          pip install --upgrade pip
          pip install "dbt-core==1.8.7" "dbt-snowflake==1.8.4" "sqlfluff==3.1.1" "sqlfluff-templater-dbt==3.1.1"

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: dbt parse
        working-directory: dbt
        # `parse` compiles the whole project without connecting to Snowflake,
        # so a broken ref, a missing macro or a bad YAML fails the PR.
        env:
          SNOWFLAKE_ACCOUNT: dummy
          SNOWFLAKE_USER: dummy
          SNOWFLAKE_PASSWORD: dummy
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
        run: |
          cp profiles.example.yml profiles.yml
          dbt parse --target dev

      - name: sqlfluff
        working-directory: dbt
        env:
          SNOWFLAKE_ACCOUNT: dummy
          SNOWFLAKE_USER: dummy
          SNOWFLAKE_PASSWORD: dummy
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
        run: sqlfluff lint models tests --format github-annotation-native

  docker:
    name: Image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: weather-pipeline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate DAGs
        # Import, graph shape AND template rendering. The last one is the
        # reason this job exists: Airflow renders templates at execution, so a
        # bad Jinja filter in the final task of a backfill only shows up after
        # every other task has already done its work.
        run: |
          docker run --rm \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=False \
            -e AIRFLOW__CORE__UNIT_TEST_MODE=True \
            -e PYTHONPATH=/opt/pipeline/src:/opt/airflow/dags \
            -v "${{ github.workspace }}/airflow/dags:/opt/airflow/dags" \
            -v "${{ github.workspace }}/scripts:/opt/pipeline/scripts" \
            weather-pipeline:ci \
            python /opt/pipeline/scripts/validate_dags.py /opt/airflow/dags

  ci-passed:
    name: CI passed
    # One required check to protect the branch with, instead of six that change
    # names every time the matrix does.
    if: always()
    needs: [lint, test, dbt, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "one or more jobs failed"
            exit 1
          fi
          echo "all green"
