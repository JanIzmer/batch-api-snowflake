version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for the whole dev toolchain: these move together and each one on
      # its own is pure review noise.
      dev-tooling:
        patterns: ["ruff", "mypy", "pytest*", "respx", "sqlfluff*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: monthly
