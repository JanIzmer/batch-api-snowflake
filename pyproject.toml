[project]
name = "weather-batch-pipeline"
version = "0.1.0"
description = "Batch ingestion from a public weather API into Snowflake, modelled with dbt"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tenacity>=8.3",
    "pyarrow>=16.0",
    "snowflake-connector-python>=3.10",
    "structlog>=24.1",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
weather-pipeline = "pipeline.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "RUF"]
ignore = ["B008"]  # typer uses function calls in defaults

[tool.mypy]
python_version = "3.11"
packages = ["pipeline"]
mypy_path = "src"
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# These ship no type information and no stubs exist. Silencing the
# import error is honest; the alternative is a blanket
# ignore_missing_imports that also hides our own broken imports.
module = ["pyarrow.*", "snowflake.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = ["integration: talks to a real external system, skipped in CI"]
